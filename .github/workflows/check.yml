name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for script in install.sh uninstall.sh scripts/replace-task-manager.sh; do
            bash -n "$script"
          done
      - name: Package and license checks
        run: python3 tests/check-package.py
      - name: Panel replacement and installer tests (mocked systemd)
        run: python3 tests/panel-replacement.py
      - name: Python syntax (no generated files)
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('tests', 'scripts'):
              for path in Path(directory).glob('*.py'):
                  ast.parse(path.read_text(), filename=str(path))
          PY
